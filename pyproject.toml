[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sprayframegen"
version = "0.1.0"
description = "Генератор синтетических кадров распыла"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.3.5", "Pillow==12.0.0"]

[project.scripts]
sprayframegen = "sprayframegen.__main__:main"

[tool.setuptools.packages.find]
include = ["sprayframegen*"]
